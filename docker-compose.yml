name: Dima

# Espelha o ambiente do Railway localmente: PostgreSQL + um serviço único
# (a API serve o Blazor WASM). A porta interna é a PORT (8080), igual ao Railway.

services:
  postgres:
    image: postgres:17-alpine
    container_name: dima-postgres
    environment:
      - POSTGRES_USER=dima
      - POSTGRES_PASSWORD=dima
      - POSTGRES_DB=dima
    ports:
      - "5432:5432"
    volumes:
      - dima-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dima -d dima"]
      interval: 3s
      timeout: 3s
      retries: 15
    networks:
      - dima-net

  dima:
    build:
      context: .
      args:
        # Sem BACKEND_URL: o WASM usa a própria origem (single-service), igual
        # ao Railway. Só defina se o front rodar em host separado da API.
        - STRIPE_PUBLIC_KEY=pk_test_sua_chave_aqui
    container_name: dima
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - PORT=8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=dima;Username=dima;Password=dima
      - BackendUrl=http://localhost:8080
      - FrontendUrl=http://localhost:8080
      - StripeApiKey=sk_test_sua_chave_aqui
    ports:
      - "8080:8080"
    networks:
      - dima-net

networks:
  dima-net:
    driver: bridge

volumes:
  dima-pgdata:
